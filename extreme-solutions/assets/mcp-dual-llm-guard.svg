<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2238"/>
      <stop offset="1" stop-color="#16304c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0e9bb8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0e9bb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity=".1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="800" cy="500" r="360" fill="url(#glow)"/>

  <!-- Untrusted input (e-mail, web, MCP tool descriptions) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="150" y="330" width="300" height="340" rx="28" fill="#1e3148" stroke="#c77912" stroke-width="4"/>
    <path d="M200 400h200M200 450h170M200 500h200M200 550h140M200 600h180" stroke="#c77912" stroke-opacity=".55" stroke-width="12"/>
    <path d="M450 500h130" stroke="#c77912" stroke-width="6" stroke-dasharray="4 18"/>
  </g>

  <!-- Reference monitor shield -->
  <path d="M800 270l190 70v150c0 125-80 215-190 260-110-45-190-135-190-260V340z" fill="#0b1220" stroke="url(#shield)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M720 505l55 55 110-120" fill="none" stroke="#38bdf8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two isolated models with symbolic memory -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M1020 420h110M1020 580h110" stroke="#38bdf8" stroke-width="6" stroke-dasharray="4 18"/>
    <rect x="1150" y="300" width="300" height="180" rx="28" fill="#1e3148" stroke="#2563eb" stroke-width="4"/>
    <rect x="1150" y="520" width="300" height="180" rx="28" fill="#1e3148" stroke="#188b57" stroke-width="4"/>
    <circle cx="1220" cy="390" r="28" fill="#2563eb"/>
    <circle cx="1220" cy="610" r="28" fill="#188b57"/>
    <rect x="1270" y="372" width="140" height="36" rx="18" fill="#2563eb" fill-opacity=".35"/>
    <rect x="1270" y="592" width="140" height="36" rx="18" fill="#188b57" fill-opacity=".35"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#e2e8f0" text-anchor="middle">
    <text x="1340" y="398">$VAR1</text>
    <text x="1340" y="618">$VAR2</text>
  </g>
</svg>
