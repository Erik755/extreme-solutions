<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a4a6e"/>
      <stop offset="1" stop-color="#245a82"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".65"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#356089"/>
      <stop offset="1" stop-color="#2a5078"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0ea5e9" flood-opacity=".35"/>
    </filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#e0f2fe" fill-opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" rx="0" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="800" cy="460" r="380" fill="url(#glow)"/>

  <!-- Untrusted input -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="140" y="300" width="320" height="380" rx="32" fill="url(#panel)" stroke="#fbbf24" stroke-width="6"/>
    <path d="M200 380h200M200 440h180M200 500h200M200 560h150M200 620h190" stroke="#fcd34d" stroke-opacity=".9" stroke-width="14"/>
    <path d="M460 490h120" stroke="#fbbf24" stroke-width="8" stroke-dasharray="6 16"/>
  </g>
  <text x="300" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#fde68a" letter-spacing=".04em">ENTRADA</text>

  <!-- Reference monitor shield -->
  <g filter="url(#soft)">
    <path d="M800 220l220 80v170c0 145-95 250-220 300-125-50-220-155-220-300V300z" fill="#0f2740" stroke="url(#shield)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M710 500l60 60 120-130" fill="none" stroke="#7dd3fc" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="780" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#bae6fd" letter-spacing=".06em">MONITOR</text>

  <!-- Two isolated models -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M1020 400h100M1020 580h100" stroke="#7dd3fc" stroke-width="8" stroke-dasharray="6 16"/>
    <rect x="1140" y="270" width="320" height="200" rx="32" fill="url(#panel)" stroke="#60a5fa" stroke-width="6"/>
    <rect x="1140" y="510" width="320" height="200" rx="32" fill="url(#panel)" stroke="#34d399" stroke-width="6"/>
    <circle cx="1220" cy="370" r="34" fill="#3b82f6"/>
    <circle cx="1220" cy="610" r="34" fill="#10b981"/>
    <rect x="1280" y="348" width="150" height="44" rx="22" fill="#60a5fa" fill-opacity=".45"/>
    <rect x="1280" y="588" width="150" height="44" rx="22" fill="#34d399" fill-opacity=".45"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">
    <text x="1355" y="378">$VAR1</text>
    <text x="1355" y="618">$VAR2</text>
  </g>
  <text x="1300" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#bfdbfe" letter-spacing=".04em">LLM AISLADOS</text>
</svg>
